name: Build Orbit Browser

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Orbit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows application
        run: npm run dist -- --win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Browser-Windows
          path: dist/*.exe
