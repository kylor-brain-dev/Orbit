name: Build Orbit Browser

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Orbit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows application
        run: npm run dist -- --win --publish never

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "dist\Orbit Browser Setup 2.0.0.exe"

          if (!(Test-Path $installer)) {
            Write-Error "Orbit installer was not created."
            Get-ChildItem -Path dist -Recurse
            exit 1
          }

          Write-Host "Orbit installer found:"
          Get-Item $installer | Select-Object FullName, Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Browser-Windows
          path: |
            dist/Orbit Browser Setup 2.0.0.exe
            dist/Orbit Browser Setup 2.0.0.exe.blockmap
          if-no-files-found: error
